# Production compose cho một VPS.
#
# Cách chạy thủ công trên server:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#
# Lưu ý:
#   - .env nằm ở root repo trên VPS, KHÔNG commit.
#   - Với compose này, DATABASE_URL/REDIS_URL/S3_ENDPOINT trong .env nên trỏ vào
#     service name nội bộ: postgres, redis, minio.
#   - File upload vẫn lưu trên ổ VPS trong volume minio-data. S3_* chỉ là tên
#     biến vì MinIO nói giao thức S3-compatible, không có nghĩa là dùng AWS S3.
#   - Nếu đặt S3_PUBLIC_BASE_URL=https://media.example.com thì reverse proxy cần
#     trỏ domain đó tới MinIO port 9000 và bucket phải cho phép public download.

name: socialhub-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-socialhub}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_BASE_URL}
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        if [ "$$MINIO_PUBLIC_READ" = "true" ]; then
          mc anonymous set download "local/$$S3_BUCKET";
        else
          mc anonymous set none "local/$$S3_BUCKET";
        fi

  migrate:
    image: ${MIGRATE_IMAGE:-socialhub-migrate:local}
    build:
      context: ..
      dockerfile: docker/migrate.Dockerfile
    profiles: ['tools']
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${API_IMAGE:-socialhub-api:local}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE:-socialhub-worker:local}
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${WORKER_BIND_ADDRESS:-127.0.0.1}:${WORKER_HOST_PORT:-4001}:${WORKER_HEALTH_PORT:-4001}'
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-socialhub-web:local}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SocialHub Manager}
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
  minio-data:

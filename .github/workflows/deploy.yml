name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialhub
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: socialhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Prepare CI env
        run: |
          cp .env.example .env
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=postgresql://socialhub:ci_password@localhost:5432/socialhub_test?schema=public"
            echo "REDIS_URL=redis://localhost:6379"
            echo "ENCRYPTION_KEYS=v1:$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "ENCRYPTION_ACTIVE_KEY=v1"
          } >> .env

      - name: Validate Prisma schema
        run: npm run db:validate -w @socialhub/db

      - name: Generate Prisma client
        run: npm run db:generate -w @socialhub/db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: images
        shell: bash
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${image_prefix}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "worker=${image_prefix}-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=${image_prefix}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migrate=${image_prefix}-migrate:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ${{ steps.images.outputs.worker }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.images.outputs.web }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'SocialHub Manager' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: true
          tags: ${{ steps.images.outputs.migrate }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Create release archive
        run: |
          git archive --format=tar.gz --output=socialhub-release-${{ github.sha }}.tar.gz HEAD
          tar -tzf socialhub-release-${{ github.sha }}.tar.gz docker/docker-compose.prod.yml package.json >/dev/null

      - name: Upload release archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 5m
          source: socialhub-release-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/home/vmadmin/tool_social"
            fi

            RELEASE_ARCHIVE="/tmp/socialhub-release-${{ github.sha }}.tar.gz"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is not installed. Install Docker Compose v2 or docker-compose on the VPS."
              exit 1
            fi

            if [ ! -f "$RELEASE_ARCHIVE" ]; then
              echo "Missing release archive: $RELEASE_ARCHIVE"
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              echo "Missing $DEPLOY_PATH/.env. Create it from .env.example and fill production values."
              exit 1
            fi

            cp "$DEPLOY_PATH/.env" /tmp/socialhub.env.backup
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
            tar -xzf "$RELEASE_ARCHIVE" -C "$DEPLOY_PATH"
            mv /tmp/socialhub.env.backup "$DEPLOY_PATH/.env"
            chmod 600 "$DEPLOY_PATH/.env"

            cd "$DEPLOY_PATH"

            export API_IMAGE="${{ steps.images.outputs.api }}"
            export WORKER_IMAGE="${{ steps.images.outputs.worker }}"
            export WEB_IMAGE="${{ steps.images.outputs.web }}"
            export MIGRATE_IMAGE="${{ steps.images.outputs.migrate }}"

            cleanup_socialhub_images() {
              echo "Pruning old SocialHub images:"
              for repo in "${API_IMAGE%:*}" "${WORKER_IMAGE%:*}" "${WEB_IMAGE%:*}" "${MIGRATE_IMAGE%:*}"; do
                docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r image; do
                  if [ "$image" = "$API_IMAGE" ] || [ "$image" = "$WORKER_IMAGE" ] || [ "$image" = "$WEB_IMAGE" ]; then
                    continue
                  fi

                  docker image rm "$image" >/dev/null 2>&1 || true
                done
              done
            }

            echo "Disk usage before Docker cleanup:"
            df -h /
            docker system df || true
            find /tmp -maxdepth 1 -type f -name 'socialhub-release-*.tar.gz' -mtime +1 -delete || true
            docker container prune -f || true
            cleanup_socialhub_images || true
            docker image prune -f || true
            docker builder prune -af || true
            echo "Disk usage after Docker cleanup:"
            df -h /
            docker system df || true

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env config >/dev/null

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env pull postgres redis minio minio-init
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env pull api worker web
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env --profile tools pull migrate
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d --no-build postgres redis minio
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d --no-build --force-recreate minio-init

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env --profile tools run --rm migrate

            if ! $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d --no-build --remove-orphans api worker web; then
              echo "Application containers failed to become healthy. Recent logs:"
              $COMPOSE -f docker/docker-compose.prod.yml --env-file .env ps || true
              $COMPOSE -f docker/docker-compose.prod.yml --env-file .env logs --tail=200 api worker web || true
              exit 1
            fi

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env ps
            cleanup_socialhub_images || true
            docker image prune -f
            docker builder prune -af
            docker logout ghcr.io || true
            rm -f "$RELEASE_ARCHIVE"

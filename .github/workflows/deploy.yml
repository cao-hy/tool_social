name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialhub
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: socialhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI env
        run: |
          cp .env.example .env
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=postgresql://socialhub:ci_password@localhost:5432/socialhub_test?schema=public"
            echo "REDIS_URL=redis://localhost:6379"
            echo "ENCRYPTION_KEYS=v1:$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "ENCRYPTION_ACTIVE_KEY=v1"
          } >> .env

      - name: Validate Prisma schema
        run: npm run db:validate -w @socialhub/db

      - name: Generate Prisma client
        run: npm run db:generate -w @socialhub/db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/var/www/tool_social"
            fi

            cd "$DEPLOY_PATH"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is not installed. Install Docker Compose v2 or docker-compose on the VPS."
              exit 1
            fi

            if [ ! -d .git ]; then
              echo "Deploy path does not contain a git repository: $DEPLOY_PATH"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_PATH/.env. Create it from .env.example and fill production values."
              exit 1
            fi

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env config >/dev/null

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env pull postgres redis minio minio-init
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d postgres redis minio
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d --force-recreate minio-init

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env build --pull migrate api worker web
            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env --profile tools run --rm migrate

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env up -d --remove-orphans api worker web

            $COMPOSE -f docker/docker-compose.prod.yml --env-file .env ps
            docker image prune -f
